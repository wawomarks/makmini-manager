plugins {
    id 'com.android.application'
}

android {
    namespace 'org.makmini.manager'
    compileSdk 34

    defaultConfig {
        applicationId "org.makmini.manager"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Checked-in debug key so every CI build (and every local build) updates
    // the previous install instead of failing with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
    signingConfigs {
        debug {
            storeFile file('makmini-debug.jks')
            storePassword 'makmini'
            keyAlias 'makmini'
            keyPassword 'makmini'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
