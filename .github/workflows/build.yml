name: Build makmini-manager APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build (Debug)
        run: gradle --offline assembleDebug || gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makmini-manager
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
