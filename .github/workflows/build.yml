name: Build makmini-manager APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate toolchain
        run: |
          # find Android SDK
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null || true
          sdk=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$sdk" ]; then echo "no sdkmanager"; exit 1; fi
          echo "SDKMAN=$sdk"
          # accept tool licenses
          yes 2>/dev/null | "$sdk" --licenses >/dev/null || true
          # install only what's needed
          "$sdk" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmake;3.22.1"
          # locate gradle
          gr=$(ls /opt/hostedtoolcache/gradle/*/bin/gradle 2>/dev/null | head -1)
          [ -z "$gr" ] && gr=$(ls /usr/share/gradle/bin/gradle 2>/dev/null | head -1)
          echo "GRADLE=$gr"
          if [ -z "$gr" ]; then echo "no gradle"; exit 1; fi
          "$gr" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makmini-manager
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
